# 第一阶段的起始设计配置，尚未接入训练器；参数需经短跑基准后调整。
seed = 42
device = "auto"

[data]
path = "data/raw/corpus.txt"
validation_fraction = 0.1

[tokenizer]
kind = "character"

[model]
kind = "decoder_transformer"
context_length = 256
embedding_dim = 128
num_heads = 4
num_layers = 4
dropout = 0.1

[training]
batch_size = 16
max_steps = 2000
learning_rate = 0.0003
eval_interval = 100
checkpoint_dir = "artifacts/checkpoints/tiny_char"
run_dir = "runs/tiny_char"

[generation]
max_new_tokens = 200
temperature = 0.8
