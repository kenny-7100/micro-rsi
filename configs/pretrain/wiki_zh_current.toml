# 大规模中文百科语料；用作当前尺寸模型的可读性对照。
seed = 42
device = "auto"

[data]
directory = "data/processed/wiki-zh-5m-v2"

[tokenizer]
kind = "character"

[model]
kind = "decoder_transformer"
context_length = 256
embedding_dim = 128
num_heads = 4
num_layers = 4
ff_dim = 512
init_std = 0.02
dropout = 0.1

[training]
batch_size = 16
max_steps = 6000
learning_rate = 0.0003
weight_decay = 0.01
grad_clip = 1.0
eval_interval = 500
eval_batches = 20
checkpoint_dir = "artifacts/checkpoints/wiki-zh-current"
run_dir = "runs/wiki-zh-current"

[generation]
max_new_tokens = 80
temperature = 0.7
