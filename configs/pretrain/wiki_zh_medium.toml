# 同数据、词表、步数下的适度扩大模型对照。
seed = 42
device = "auto"

[data]
directory = "data/processed/wiki-zh-5m-v2"

[tokenizer]
kind = "character"

[model]
kind = "decoder_transformer"
context_length = 256
embedding_dim = 256
num_heads = 8
num_layers = 6
ff_dim = 1024
init_std = 0.02
dropout = 0.1

[training]
batch_size = 16
max_steps = 6000
learning_rate = 0.0003
weight_decay = 0.01
grad_clip = 1.0
eval_interval = 500
eval_batches = 20
checkpoint_dir = "artifacts/checkpoints/wiki-zh-medium"
run_dir = "runs/wiki-zh-medium"

[generation]
max_new_tokens = 80
temperature = 0.7
