# 共享词表对照实验 nahan-panghuang；相对路径以执行命令时的项目根目录为基准。
seed = 42
device = "auto"

[data]
directory = "data/processed/nahan-panghuang"

[tokenizer]
kind = "character"

[model]
kind = "decoder_transformer"
context_length = 256
embedding_dim = 128
num_heads = 4
num_layers = 4
ff_dim = 512
init_std = 0.02
dropout = 0.1

[training]
batch_size = 16
max_steps = 2000
learning_rate = 0.0003
weight_decay = 0.01
grad_clip = 1.0
eval_interval = 100
eval_batches = 10
checkpoint_dir = "artifacts/checkpoints/nahan-panghuang"
run_dir = "runs/nahan-panghuang"

[generation]
max_new_tokens = 200
temperature = 0.8
